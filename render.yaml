services:
  - type: web
    name: step-multilevel-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: TZ
        value: Asia/Tashkent
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: CHANNEL_NAME
        value: "Step Multilevel"
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: LEAD_MINUTES
        value: "10"

  # --- Website: stepschoolkids.uz (Next.js, lives in /web) ---
  - type: web
    name: step-school-kids-web
    runtime: node
    plan: free
    region: frankfurt
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRIAL_TELEGRAM_BOT_TOKEN
        sync: false
      - key: TRIAL_TELEGRAM_CHAT_ID
        sync: false
